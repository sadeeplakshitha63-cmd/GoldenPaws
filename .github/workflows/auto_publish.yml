name: Auto Generate Content & Publish

on:
  schedule:
    # Runs exactly 5 times a day (Safe for Pinterest and GitHub Limits)
    - cron: '0 2,7,12,17,22 * * *'
  workflow_dispatch: # Allows you to run it manually from GitHub interface

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install google-generativeai requests
        
    - name: Run Automation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      run: python auto_publisher.py
      
    - name: Commit and Push Changes
      run: |
        git config --global user.name "GoldenPaws Auto-Bot"
        git config --global user.email "bot@goldenpaws.com"
        git add .
        git commit -m "Auto-generated new daily articles & updated RSS/Sitemap" || echo "No changes to commit"
        git push
